<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>LZR Automobile — Hero White</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1440px; height: 700px; overflow: hidden; background: #F5F5F5; font-family: 'Inter', sans-serif; }

  .hero {
    position: relative; width: 1440px; height: 700px;
    background: #F8F8F8;
    display: flex; align-items: center; overflow: hidden;
  }

  /* Subtle noise texture */
  .bg-texture {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  /* Left red vertical band */
  .left-band {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6px;
    background: linear-gradient(180deg, #DC1515 0%, #B91010 100%);
  }

  /* Red accent lines */
  .line-accent {
    position: absolute; top: 0; right: 26%; width: 1px; height: 100%;
    background: linear-gradient(180deg, transparent 0%, rgba(220,21,21,0.12) 40%, rgba(220,21,21,0.06) 70%, transparent 100%);
  }

  /* Top red bar */
  .top-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #DC1515 0%, #F43030 50%, transparent 100%);
  }

  /* Car container */
  .car-container {
    position: absolute; right: -20px; bottom: 0;
    width: 820px; height: 560px;
  }

  /* Light ground reflection on white */
  .ground-glow {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    width: 680px; height: 50px;
    background: radial-gradient(ellipse 100% 100% at 50% 100%, rgba(220,21,21,0.25) 0%, rgba(220,21,21,0.06) 50%, transparent 80%);
    filter: blur(10px);
  }
  .ground-line {
    position: absolute; bottom: 38px; left: 30px; right: 10px; height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(220,21,21,0.5) 30%, rgba(220,21,21,0.7) 50%, rgba(220,21,21,0.25) 80%, transparent 100%);
  }

  /* Content */
  .content {
    position: relative; z-index: 10;
    padding-left: 100px; max-width: 620px;
  }

  .logo {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 52px;
  }
  .logo-icon { width: 52px; height: 52px; }
  .logo-text { display: flex; flex-direction: column; gap: 2px; }
  .logo-name {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
    font-size: 22px; letter-spacing: 3px; color: #0A0A0A;
    text-transform: uppercase; line-height: 1;
  }
  .logo-sub {
    font-family: 'Inter', sans-serif; font-weight: 500;
    font-size: 10px; letter-spacing: 3.5px; color: #999;
    text-transform: uppercase;
  }

  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 14px;
    background: rgba(220,21,21,0.06);
    border: 1px solid rgba(220,21,21,0.2);
    border-radius: 4px; margin-bottom: 28px;
  }
  .badge-dot {
    width: 6px; height: 6px; background: #DC1515; border-radius: 50%;
    box-shadow: 0 0 8px rgba(220,21,21,0.6);
  }
  .badge-text {
    font-family: 'Inter', sans-serif; font-weight: 600;
    font-size: 11px; letter-spacing: 1.8px; color: #DC1515;
    text-transform: uppercase;
  }

  .title { margin-bottom: 24px; line-height: 0.88; }
  .title-line1 {
    display: block;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 108px; color: #0A0A0A; text-transform: uppercase; letter-spacing: -2px;
  }
  .title-line2 {
    display: block;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900;
    font-size: 108px; text-transform: uppercase; letter-spacing: -2px;
    color: #DC1515;
  }

  .subtitle {
    font-family: 'Inter', sans-serif; font-weight: 400;
    font-size: 18px; line-height: 1.7; color: #666;
    max-width: 420px; margin-bottom: 44px;
  }

  .cta-row { display: flex; gap: 16px; align-items: center; margin-bottom: 52px; }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 36px; background: #DC1515; color: #FFFFFF;
    font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px;
    letter-spacing: 1.2px; text-transform: uppercase;
    border-radius: 6px; border: none; cursor: pointer;
    box-shadow: 0 4px 0 rgba(100,0,0,0.4), 0 8px 24px rgba(220,21,21,0.25);
    text-decoration: none;
  }

  .btn-secondary {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 15px 32px; background: transparent; color: #0A0A0A;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px;
    letter-spacing: 1.2px; text-transform: uppercase;
    border-radius: 6px; border: 1.5px solid rgba(0,0,0,0.2); text-decoration: none;
  }

  .stats { display: flex; gap: 0; align-items: center; }
  .stat {
    padding: 0 36px 0 0; margin-right: 36px;
    border-right: 1px solid rgba(0,0,0,0.1);
  }
  .stat:last-child { border-right: none; padding-right: 0; margin-right: 0; }
  .stat-num {
    font-family: 'JetBrains Mono', monospace; font-weight: 600;
    font-size: 28px; color: #0A0A0A; display: block; line-height: 1;
  }
  .stat-label {
    font-family: 'Inter', sans-serif; font-weight: 400;
    font-size: 12px; color: #999; text-transform: uppercase;
    letter-spacing: 0.8px; margin-top: 5px;
  }

  .scroll-hint {
    position: absolute; bottom: 32px; left: 100px;
    display: flex; align-items: center; gap: 10px;
  }
  .scroll-line { width: 32px; height: 1px; background: rgba(220,21,21,0.4); }
  .scroll-text { font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 2px; color: #BBB; text-transform: uppercase; }
</style>
</head>
<body>
<div class="hero">
  <div class="bg-texture"></div>
  <div class="left-band"></div>
  <div class="top-bar"></div>
  <div class="line-accent"></div>

  <div class="content">
    <!-- Logo -->
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="52" height="52" rx="8" fill="#F0F0F0" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
        <path d="M6 32 L10 24 L16 20 L36 20 L44 24 L46 32 L6 32Z" fill="#DC1515"/>
        <path d="M14 20 L18 14 L34 14 L38 20Z" fill="#B91010"/>
        <circle cx="14" cy="33" r="4" fill="#E8E8E8" stroke="#DC1515" stroke-width="1.5"/>
        <circle cx="38" cy="33" r="4" fill="#E8E8E8" stroke="#DC1515" stroke-width="1.5"/>
        <line x1="2" y1="27" x2="8" y2="27" stroke="rgba(220,21,21,0.4)" stroke-width="1"/>
        <line x1="2" y1="30" x2="7" y2="30" stroke="rgba(220,21,21,0.25)" stroke-width="1"/>
      </svg>
      <div class="logo-text">
        <span class="logo-name">LZR Automobile</span>
        <span class="logo-sub">Dealer Auto</span>
      </div>
    </div>

    <div class="badge">
      <div class="badge-dot"></div>
      <span class="badge-text">Dealer Auto Premium · România</span>
    </div>

    <div class="title">
      <span class="title-line1">MAȘINI</span>
      <span class="title-line2">CERTIFICATE</span>
    </div>

    <p class="subtitle">Selectate și verificate de experți. Istoric complet, ITP valabil, garanție și finanțare disponibilă.</p>

    <div class="cta-row">
      <a href="#" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        Explorează Parcul Auto
      </a>
      <a href="#" class="btn-secondary">Contactează-ne</a>
    </div>

    <div class="stats">
      <div class="stat"><span class="stat-num">120+</span><span class="stat-label">Mașini disponibile</span></div>
      <div class="stat"><span class="stat-num">10+</span><span class="stat-label">Ani experiență</span></div>
      <div class="stat"><span class="stat-num">500+</span><span class="stat-label">Clienți mulțumiți</span></div>
    </div>
  </div>

  <!-- Car -->
  <div class="car-container">
    <div class="ground-glow"></div>
    <div class="ground-line"></div>
    <svg viewBox="0 0 820 520" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;bottom:40px;left:0;width:820px;height:480px">
      <ellipse cx="410" cy="490" rx="340" ry="16" fill="rgba(0,0,0,0.08)"/>
      <path d="M60 340 L80 300 L130 260 L200 230 L280 200 L380 185 L500 185 L600 200 L660 240 L700 280 L720 320 L730 340 L60 340Z" fill="url(#bodyGradW)"/>
      <path d="M200 230 L240 185 L310 158 L420 148 L520 152 L580 175 L620 205 L600 200 L500 185 L380 185 L280 200 L200 230Z" fill="url(#roofGradW)"/>
      <path d="M205 228 L242 186 L308 160 L415 150 L415 185 L285 200 L205 228Z" fill="rgba(180,210,240,0.5)" stroke="rgba(220,21,21,0.15)" stroke-width="1"/>
      <path d="M415 150 L520 152 L575 172 L615 200 L600 200 L500 185 L415 185 L415 150Z" fill="rgba(160,200,230,0.4)" stroke="rgba(220,21,21,0.1)" stroke-width="1"/>
      <path d="M270 200 L275 340" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>
      <path d="M415 185 L420 340" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>
      <path d="M560 190 L562 340" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>
      <rect x="340" y="260" width="32" height="6" rx="3" fill="rgba(0,0,0,0.1)"/>
      <rect x="486" y="260" width="32" height="6" rx="3" fill="rgba(0,0,0,0.1)"/>
      <path d="M680 240 L720 270 L728 310 L718 310 L710 278 L674 252 Z" fill="rgba(255,220,150,0.2)" stroke="rgba(255,180,60,0.4)" stroke-width="1"/>
      <path d="M685 244 L718 268" stroke="rgba(255,200,80,0.9)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M80 300 L60 330 L62 342 L75 342 L95 315 Z" fill="rgba(220,21,21,0.2)" stroke="rgba(220,21,21,0.5)" stroke-width="1"/>
      <path d="M68 302 L64 334" stroke="rgba(220,21,21,0.8)" stroke-width="2" stroke-linecap="round"/>
      <path d="M670 228 L690 220 L695 235 L670 238 Z" fill="url(#bodyGradW)" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <path d="M100 340 Q160 290 220 340Z" fill="url(#archGradW)"/>
      <path d="M540 340 Q600 290 660 340Z" fill="url(#archGradW)"/>
      <path d="M700 320 L730 340 L720 345 L696 345 L700 320Z" fill="url(#frontBumperW)"/>
      <path d="M115 340 L650 340" stroke="rgba(220,21,21,0.6)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M200 230 L280 200 L500 185 L600 200 L660 240" stroke="rgba(220,21,21,0.2)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Wheels -->
      <circle cx="598" cy="365" r="58" fill="#1A1A1A" stroke="#333" stroke-width="2"/>
      <circle cx="598" cy="365" r="50" fill="#111"/>
      <g stroke="rgba(200,200,200,0.8)" stroke-width="2.5" stroke-linecap="round">
        <line x1="598" y1="320" x2="598" y2="340"/><line x1="598" y1="390" x2="598" y2="410"/>
        <line x1="553" y1="365" x2="573" y2="365"/><line x1="623" y1="365" x2="643" y2="365"/>
        <line x1="566" y1="333" x2="580" y2="347"/><line x1="616" y1="383" x2="630" y2="397"/>
        <line x1="630" y1="333" x2="616" y2="347"/><line x1="580" y1="383" x2="566" y2="397"/>
      </g>
      <circle cx="598" cy="365" r="16" fill="#222" stroke="rgba(220,21,21,0.6)" stroke-width="2"/>
      <circle cx="598" cy="365" r="8" fill="#DC1515"/>
      <circle cx="168" cy="365" r="58" fill="#1A1A1A" stroke="#333" stroke-width="2"/>
      <circle cx="168" cy="365" r="50" fill="#111"/>
      <g stroke="rgba(200,200,200,0.8)" stroke-width="2.5" stroke-linecap="round">
        <line x1="168" y1="320" x2="168" y2="340"/><line x1="168" y1="390" x2="168" y2="410"/>
        <line x1="123" y1="365" x2="143" y2="365"/><line x1="193" y1="365" x2="213" y2="365"/>
        <line x1="136" y1="333" x2="150" y2="347"/><line x1="186" y1="383" x2="200" y2="397"/>
        <line x1="200" y1="333" x2="186" y2="347"/><line x1="150" y1="383" x2="136" y2="397"/>
      </g>
      <circle cx="168" cy="365" r="16" fill="#222" stroke="rgba(220,21,21,0.6)" stroke-width="2"/>
      <circle cx="168" cy="365" r="8" fill="#DC1515"/>
      <!-- White body highlight -->
      <path d="M260 175 L420 150 L530 158 L570 172" stroke="rgba(255,255,255,0.5)" stroke-width="10" stroke-linecap="round"/>
      <path d="M220 222 L370 192 L500 185 L590 196 L625 212" stroke="rgba(255,255,255,0.4)" stroke-width="14" stroke-linecap="round"/>
      <defs>
        <linearGradient id="bodyGradW" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#FFFFFF"/>
          <stop offset="50%" style="stop-color:#E8E8E8"/>
          <stop offset="100%" style="stop-color:#CCCCCC"/>
        </linearGradient>
        <linearGradient id="roofGradW" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#F5F5F5"/>
          <stop offset="100%" style="stop-color:#DADADA"/>
        </linearGradient>
        <linearGradient id="archGradW" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#E0E0E0"/>
          <stop offset="100%" style="stop-color:#C8C8C8"/>
        </linearGradient>
        <linearGradient id="frontBumperW" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#E8E8E8"/>
          <stop offset="100%" style="stop-color:#D0D0D0"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <div class="scroll-hint">
    <div class="scroll-line"></div>
    <span class="scroll-text">Derulează</span>
  </div>
</div>
</body>
</html>
